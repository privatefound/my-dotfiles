# ═══════════════════════════════════════════════════════════════════
# HYPRLOCK — minimale: nero, nome utente e password, verde monospazio
# ═══════════════════════════════════════════════════════════════════

$green = rgb(00ff41)
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = lin, 0, 0, 1, 1
    animation = fadeIn, 1, 3, lin
    animation = fadeOut, 1, 3, lin
    animation = inputFieldDots, 1, 2, lin
}

background {
    monitor =
    color = rgb(000000)
}

# utente@macchina
label {
    monitor =
    text = cmd[update:0] echo "$USER@$(cat /etc/hostname)"
    color = $green
    font_size = 16
    font_family = $font Bold
    position = 0, 40
    halign = center
    valign = center
}

# Password
input-field {
    monitor =
    size = 320, 44
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.5
    dots_center = true
    dots_rounding = 0
    outer_color = rgba(00ff4199)
    inner_color = rgb(000000)
    font_color = $green
    font_family = $font
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    rounding = 0
    check_color = rgba(00ff41ff)
    # password sbagliata: bordo rosso per 2,5 s
    fail_color = rgba(ff2a3dff)
    fail_text =
    fail_timeout = 2500
    fail_transition = 150
    capslock_color = rgba(ffc857ff)
    position = 0, -20
    halign = center
    valign = center
}
