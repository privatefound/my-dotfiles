# ═══════════════════════════════════════════════════════════════════
# HYPRLOCK — nero e verde terminale, coordinato con la shell
# ═══════════════════════════════════════════════════════════════════

$green = rgb(00ff41)
$dim = rgb(0b3d16)
$font = JetBrainsMono Nerd Font
$sans = Adwaita Sans

general {
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = emph, 0.05, 0.7, 0.1, 1
    animation = fadeIn, 1, 5, emph
    animation = fadeOut, 1, 5, emph
    animation = inputFieldDots, 1, 2, emph
}

# Screenshot sfocato e scurito del desktop
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 7
    brightness = 0.35
    contrast = 1.1
    vibrancy = 0.2
    color = rgb(000000)
}

# Scheda centrale
shape {
    monitor =
    size = 420, 470
    color = rgba(050806dd)
    rounding = 28
    border_size = 1
    border_color = rgba(00ff412e)
    position = 0, 0
    halign = center
    valign = center
}

# Orologio
label {
    monitor =
    text = $TIME
    color = $green
    font_size = 78
    font_family = $font ExtraBold
    position = 0, 320
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00ff4155)
}

# Data
label {
    monitor =
    text = cmd[update:60000] g=(domenica lunedì martedì mercoledì giovedì venerdì sabato); m=(gennaio febbraio marzo aprile maggio giugno luglio agosto settembre ottobre novembre dicembre); echo "${g[$(date +%w)]} $(date +%-d) ${m[$(( $(date +%-m) - 1 ))]}"
    color = rgba(c8d6cbff)
    font_size = 16
    font_family = $sans
    position = 0, 195
    halign = center
    valign = center
}

# Avatar
image {
    monitor =
    path = ~/.config/hypr/shell/assets/icons/avatar.png
    size = 104
    rounding = -1
    border_size = 2
    border_color = $green
    position = 0, 110
    halign = center
    valign = center
}

# Utente
label {
    monitor =
    text = $USER@arch-fwork
    color = $green
    font_size = 15
    font_family = $font Bold
    position = 0, 34
    halign = center
    valign = center
}

label {
    monitor =
    text = Bentornato, Operatore
    color = rgba(97a39aff)
    font_size = 12
    font_family = $sans
    position = 0, 4
    halign = center
    valign = center
}

# Password
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.45
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(00ff4166)
    inner_color = rgba(0b0e0cff)
    font_color = $green
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##4d6653">password…</span>
    hide_input = false
    rounding = -1
    check_color = rgba(00ff41ff)
    fail_color = rgba(ff5c6cff)
    fail_text = <span foreground="##ff5c6c">accesso negato  ·  $ATTEMPTS</span>
    capslock_color = rgba(ffc857ff)
    position = 0, -70
    halign = center
    valign = center
}

# Suggerimento
label {
    monitor =
    text =    Invio per sbloccare
    color = rgba(5b665eff)
    font_size = 11
    font_family = $font
    position = 0, -150
    halign = center
    valign = center
}

# Batteria (se presente)
label {
    monitor =
    text = cmd[update:30000] b=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1); [ -n "$b" ] && echo "󰁹 $b%"
    color = rgba(97a39aff)
    font_size = 12
    font_family = $font
    position = -30, 30
    halign = right
    valign = bottom
}
