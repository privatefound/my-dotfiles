# /etc/systemd/system/greetd.service.d/override.conf
# Evita che i messaggi di avvio di systemd ([ OK ] ...) finiscano sopra il login:
# greetd parte solo quando il boot è finito e ripulisce il terminale.
[Service]
Type=idle
StandardInput=tty
StandardOutput=tty
StandardError=journal
TTYReset=yes
TTYVHangup=yes
TTYVTDisallocate=yes
