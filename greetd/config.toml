# /etc/greetd/config.toml — login screen green-hyprtheme (greetd + tuigreet)
# Installato da ./install.sh (con backup del file esistente).

[terminal]
vt = 1

[default_session]
command = "tuigreet --time --time-format '%H:%M  ·  %a %d %b' --remember --remember-session --asterisks --asterisks-char '•' --window-padding 2 --container-padding 2 --prompt-padding 1 --greeting 'Wake up, Operatore…  the Matrix has you.' --cmd start-hyprland --theme 'border=green;text=green;prompt=lightgreen;time=green;action=darkgray;button=lightgreen;container=black;input=lightgreen;title=green;greet=green'"
user = "greeter"
