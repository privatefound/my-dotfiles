# ═══════════════════════════════════════════════════════════════════
# HYPRIDLE — blocco, spegnimento schermo e sospensione
# (Caffeine nella barra blocca tutto questo finché è attivo)
# ═══════════════════════════════════════════════════════════════════

general {
    lock_cmd = pidof hyprlock || hyprlock -c $HOME/.config/hypr/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 150                                # 2.5 min: abbassa la luminosità
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300                                # 5 min: blocca
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                                # 5.5 min: spegne i monitor
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 600                                # 10 min: sospende
    on-timeout = systemctl suspend
}
