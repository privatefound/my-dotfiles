# /etc/tmpfiles.d/hibernate-speed.conf — ibernazione più rapida (WhiteRabbitShell)
#
# image_size 0: il kernel scarta la cache dei file e salva solo la memoria davvero in uso
# (di default tiene fino a 2/5 della RAM: su 32 GB sono ~12 GB da scrivere e rileggere).
w- /sys/power/image_size - - - - 0
# lz4 comprime e decomprime l'immagine molto più in fretta di lzo (il predefinito)
w- /sys/module/hibernate/parameters/compressor - - - - lz4
